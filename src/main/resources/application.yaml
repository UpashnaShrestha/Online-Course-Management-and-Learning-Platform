spring:
  application:
    name: OnlineCourseManagement-LearningPlatform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ocmpl_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    test-connection: ${MAIL_TEST_CONNECTION:false}

  servlet:
      multipart:
        # Same knob as app.upload.max-image-size, so the multipart layer and the storage service
        # agree on the threshold. Spring rejects the request before the controller sees it, so an
        # oversized photo is never buffered into memory first.
        #
        # This block MUST sit inside the `spring:` section, before the next top-level key
        # (`server:`). Placed further down it becomes a child of whatever top-level key preceded
        # it -- which silently resolved to app.servlet.multipart.* and left Boot's 1 MB default
        # in force. MultipartConfigurationTest now guards the position.
        max-file-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}
        max-request-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}
        # Refuse the upload as soon as the declared size exceeds the limit, instead of reading it.
        file-size-threshold: 0

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  remember-me-refresh-token-expiration: ${JWT_REMEMBER_ME_REFRESH_TOKEN_EXPIRATION:2592000000}

app:
  upload:
    # Directory that holds user-uploaded files. Relative paths resolve against the working
    # directory, so an absolute path is recommended in production.
    dir: ${UPLOAD_DIR:./uploads}
    # Sub-path used for avatars, so other upload kinds can be added later without collision.
    profile-image-subdir: profile-images
    # Public URL prefix the directory is served under. Must match the resource handler in
    # WebConfig.
    public-path: /uploads
    # Single source for the size limit: also drives spring.servlet.multipart.* below, so the
    # two cannot drift apart and reject at different thresholds.
    max-image-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  file-storage:
    base-path: ${FILE_STORAGE_BASE_PATH:./uploaded-files}
    max-file-size: ${FILE_STORAGE_MAX_FILE_SIZE_MB:5120}

  mail:
    enabled: ${MAIL_ENABLED:true}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    dev-log-otp: ${MAIL_DEV_LOG_OTP:true}

  password-reset:
    otp-length: ${PASSWORD_RESET_OTP_LENGTH:6}
    otp-valid-minutes: ${PASSWORD_RESET_OTP_MINUTES:10}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN:60}
    expose-otp: ${PASSWORD_RESET_EXPOSE_OTP:false}

  bootstrap:
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    instructor-username: ${APP_BOOTSTRAP_INSTRUCTOR_USERNAME:}
    instructor-password: ${APP_BOOTSTRAP_INSTRUCTOR_PASSWORD:}

logging:
  level:
    org.springframework: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
